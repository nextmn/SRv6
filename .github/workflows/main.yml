---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install depends
        run: sudo apt-get install -qy make git && make dev-install
      - name: Run SQL lint and check generated files
        run: make lint
